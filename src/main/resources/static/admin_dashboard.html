<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社区管理看板 · 解尘颐安智慧社区</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="lib/js/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #f0f7ff 0%, #f5f9ff 100%);
            min-height: 100vh;
            color: #1f2a3f;
            padding: 24px 32px;
            line-height: 1.5;
        }

        .app-container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .navbar {
            background: linear-gradient(135deg, rgba(11, 42, 65, 0.95) 0%, rgba(16, 58, 88, 0.95) 100%);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            box-shadow: 0 15px 35px -12px rgba(0, 30, 60, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .navbar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .back-link {
            color: #a8ceff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: white;
        }

        .navbar-title {
            font-weight: 600;
            font-size: 1.7rem;
            color: white;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: -0.3px;
        }

        .navbar-title i {
            color: #60a5fa;
        }

        .time-panel {
            background: rgba(21, 62, 90, 0.8);
            padding: 10px 28px;
            border-radius: 40px;
            color: #cbd5e1;
            text-align: right;
            border: 1px solid rgba(47, 85, 117, 0.5);
        }

        .time-panel .date {
            font-size: 0.9rem;
            color: #b0c9e0;
        }

        .time-panel .clock {
            font-size: 1.7rem;
            font-weight: 500;
            color: white;
            line-height: 1.2;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 18px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: white;
            border-radius: 24px;
            padding: 24px 20px;
            box-shadow: 0 12px 30px -10px rgba(0, 32, 64, 0.1);
            text-align: center;
            transition: all 0.3s ease;
            border: 1px solid rgba(224, 235, 247, 0.8);
            cursor: pointer;
        }

        .stat-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 40px -12px rgba(18, 52, 77, 0.2);
            border-color: rgba(96, 165, 250, 0.3);
        }

        .stat-card.highlight {
            background: linear-gradient(135deg, #1677FF 0%, #4096ff 100%);
            color: #fff;
            border: none;
        }

        .stat-card.highlight:hover {
            box-shadow: 0 20px 40px -12px rgba(22, 119, 255, 0.4);
        }

        .stat-card.warning {
            border-left: 4px solid #FAAD14;
        }

        .stat-card.danger {
            border-left: 4px solid #F5222D;
        }

        .stat-icon {
            width: 56px;
            height: 56px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 14px;
            font-size: 26px;
        }

        .stat-card:not(.highlight) .stat-icon {
            background: linear-gradient(135deg, #E6F4FF 0%, #dbeafe 100%);
            color: #1677FF;
        }

        .stat-card.highlight .stat-icon {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .stat-card.warning .stat-icon {
            background: linear-gradient(135deg, #FFF7E6 0%, #fef3c7 100%);
            color: #FAAD14;
        }

        .stat-card.danger .stat-icon {
            background: linear-gradient(135deg, #FFF1F0 0%, #fee2e2 100%);
            color: #F5222D;
        }

        .stat-value {
            font-size: 34px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .stat-card:not(.highlight) .stat-value {
            color: #1e3a5f;
        }

        .stat-label {
            font-size: 14px;
            opacity: 0.85;
        }

        .stat-card:not(.highlight) .stat-label {
            color: #64748b;
        }

        .main-content {
            display: grid;
            grid-template-columns: 300px 1fr 340px;
            gap: 24px;
        }

        .panel {
            background: white;
            border-radius: 28px;
            box-shadow: 0 15px 35px -12px rgba(0, 32, 64, 0.12);
            overflow: hidden;
            border: 1px solid rgba(224, 235, 247, 0.8);
        }

        .panel-header {
            padding: 20px 28px;
            border-bottom: 1px solid #f0f5fb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(180deg, #fafcff 0%, #ffffff 100%);
        }

        .panel-title {
            font-size: 17px;
            font-weight: 600;
            color: #0d4e7c;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .panel-title i {
            color: #1677FF;
        }

        .panel-body {
            padding: 24px 28px;
        }

        .left-panel {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .health-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        .health-item {
            background: linear-gradient(135deg, #f5f9ff 0%, #f0f7ff 100%);
            border-radius: 18px;
            padding: 20px 16px;
            text-align: center;
            transition: all 0.3s ease;
            border: 1px solid #e0ebf7;
            cursor: pointer;
        }

        .health-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px -8px rgba(22, 119, 255, 0.2);
            border-color: #60a5fa;
            background: linear-gradient(135deg, #e6f4ff 0%, #dbeafe 100%);
        }

        .health-item.abnormal {
            background: linear-gradient(135deg, #fff1f0 0%, #fee2e2 100%);
            border-color: #fecaca;
        }

        .health-item.abnormal:hover {
            box-shadow: 0 10px 25px -8px rgba(245, 34, 45, 0.2);
            border-color: #f5222d;
        }

        .health-item-label {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .health-item-value {
            font-size: 28px;
            font-weight: 700;
        }

        .health-item-value.normal {
            color: #52C41A;
        }

        .health-item-value.warning {
            color: #FAAD14;
        }

        .health-item-value.danger {
            color: #F5222D;
        }

        .health-item-unit {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 6px;
        }

        .recent-health-list {
            max-height: 320px;
            overflow-y: auto;
        }

        .health-record {
            display: flex;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid #f0f5fb;
            transition: background 0.2s;
        }

        .health-record:last-child {
            border-bottom: none;
        }

        .health-record:hover {
            background: #f8fcff;
            margin: 0 -10px;
            padding: 14px 10px;
            border-radius: 10px;
        }

        .health-record-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 14px;
            font-size: 18px;
        }

        .health-record-icon.bp {
            background: #E6F4FF;
            color: #1677FF;
        }

        .health-record-icon.hr {
            background: #FFF7E6;
            color: #FAAD14;
        }

        .health-record-icon.bo {
            background: #F6FFED;
            color: #52C41A;
        }

        .health-record-icon.bg {
            background: #FFF0F6;
            color: #EB2F96;
        }

        .health-record-info {
            flex: 1;
        }

        .health-record-name {
            font-size: 14px;
            font-weight: 600;
            color: #1e3a5f;
        }

        .health-record-value {
            font-size: 13px;
            color: #64748b;
            margin-top: 4px;
        }

        .health-record-time {
            font-size: 12px;
            color: #94a3b8;
        }

        .center-panel {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .chart-container {
            height: 300px;
        }

        .medication-charts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .low-stock-list {
            max-height: 220px;
            overflow-y: auto;
        }

        .low-stock-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: linear-gradient(135deg, #fff7e6 0%, #fef3c7 100%);
            border-radius: 16px;
            margin-bottom: 10px;
            border: 1px solid #fed7aa;
            transition: all 0.3s ease;
        }

        .low-stock-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px -8px rgba(250, 173, 20, 0.3);
        }

        .low-stock-item:last-child {
            margin-bottom: 0;
        }

        .low-stock-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .low-stock-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FAAD14 0%, #d97706 100%);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 600;
        }

        .low-stock-name {
            font-size: 14px;
            font-weight: 600;
            color: #1e3a5f;
        }

        .low-stock-medicine {
            font-size: 13px;
            color: #78350f;
            margin-top: 4px;
        }

        .low-stock-count {
            text-align: right;
        }

        .low-stock-count-value {
            font-size: 18px;
            font-weight: 700;
            color: #b45309;
        }

        .low-stock-count-unit {
            font-size: 12px;
            color: #92400e;
        }

        .right-panel {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .emergency-stats {
            display: flex;
            gap: 16px;
            margin-bottom: 18px;
        }

        .emergency-stat {
            flex: 1;
            background: linear-gradient(135deg, #fff1f0 0%, #fee2e2 100%);
            border-radius: 18px;
            padding: 18px 14px;
            text-align: center;
            border: 1px solid #fecaca;
        }

        .emergency-stat-value {
            font-size: 30px;
            font-weight: 700;
            color: #F5222D;
        }

        .emergency-stat-label {
            font-size: 13px;
            color: #991b1b;
            margin-top: 6px;
            font-weight: 500;
        }

        .emergency-list {
            max-height: 220px;
            overflow-y: auto;
        }

        .emergency-item {
            display: flex;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid #f0f5fb;
            cursor: pointer;
            transition: background 0.2s;
        }

        .emergency-item:last-child {
            border-bottom: none;
        }

        .emergency-item:hover {
            background: #fef2f2;
            margin: 0 -10px;
            padding: 14px 10px;
            border-radius: 10px;
        }

        .emergency-item-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, #F5222D 0%, #dc2626 100%);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 14px;
            font-size: 18px;
        }

        .emergency-item-info {
            flex: 1;
        }

        .emergency-item-name {
            font-size: 14px;
            font-weight: 600;
            color: #1e3a5f;
        }

        .emergency-item-time {
            font-size: 13px;
            color: #64748b;
            margin-top: 4px;
        }

        .emergency-item-status {
            font-size: 12px;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 500;
        }

        .emergency-item-status.answered {
            background: #F6FFED;
            color: #52C41A;
        }

        .emergency-item-status.calling {
            background: #FFF7E6;
            color: #FAAD14;
        }

        .emergency-item-status.cancelled {
            background: #F0F0F0;
            color: #666;
        }

        .emergency-item-status.timeout,
        .emergency-item-status.no_answer {
            background: #FFF1F0;
            color: #F5222D;
        }

        .news-stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        .news-stat-item {
            background: linear-gradient(135deg, #f0f7ff 0%, #e6f4ff 100%);
            border-radius: 18px;
            padding: 18px 14px;
            text-align: center;
            border: 1px solid #dbeafe;
        }

        .news-stat-value {
            font-size: 26px;
            font-weight: 700;
            color: #1677FF;
        }

        .news-stat-label {
            font-size: 13px;
            color: #1e40af;
            margin-top: 6px;
            font-weight: 500;
        }

        .news-list {
            max-height: 200px;
            overflow-y: auto;
            margin-top: 18px;
        }

        .news-item {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f0f5fb;
            cursor: pointer;
            transition: background 0.2s;
        }

        .news-item:last-child {
            border-bottom: none;
        }

        .news-item:hover {
            background: #f0f7ff;
            margin: 0 -10px;
            padding: 12px 10px;
            border-radius: 10px;
        }

        .news-item-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1677FF 0%, #4096ff 100%);
            margin-right: 12px;
            flex-shrink: 0;
        }

        .news-item-title {
            flex: 1;
            font-size: 14px;
            color: #1e3a5f;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 500;
        }

        .news-item-time {
            font-size: 12px;
            color: #94a3b8;
            margin-left: 12px;
            flex-shrink: 0;
        }

        .empty-state {
            text-align: center;
            padding: 48px 24px;
            color: #94a3b8;
        }

        .empty-state i {
            font-size: 52px;
            margin-bottom: 18px;
            opacity: 0.4;
        }

        .empty-state-text {
            font-size: 14px;
            font-weight: 500;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 28px;
            width: 92%;
            max-width: 850px;
            max-height: 85vh;
            overflow: hidden;
            box-shadow: 0 25px 60px -15px rgba(0, 20, 40, 0.4);
            animation: modalSlideIn 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-25px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 22px 32px;
            border-bottom: 1px solid #f0f5fb;
            background: linear-gradient(135deg, #1677FF 0%, #4096ff 100%);
            color: #fff;
        }

        .modal-title {
            font-size: 19px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .modal-close {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.18);
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.28);
        }

        .modal-body {
            padding: 28px 32px;
            max-height: 65vh;
            overflow-y: auto;
        }

        .modal-table {
            width: 100%;
            border-collapse: collapse;
        }

        .modal-table th,
        .modal-table td {
            padding: 14px 18px;
            text-align: left;
            border-bottom: 1px solid #f0f5fb;
        }

        .modal-table th {
            background: linear-gradient(180deg, #f5f9ff 0%, #f0f7ff 100%);
            font-weight: 600;
            color: #0d4e7c;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .modal-table td {
            font-size: 14px;
            color: #475569;
        }

        .modal-table tr:hover td {
            background: #f8fcff;
        }

        .status-tag {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-tag.danger {
            background: #FFF1F0;
            color: #F5222D;
        }

        .status-tag.warning {
            background: #FFF7E6;
            color: #FAAD14;
        }

        .status-tag.success {
            background: #F6FFED;
            color: #52C41A;
        }

        .status-tag.info {
            background: #E6F4FF;
            color: #1677FF;
        }

        .modal-empty {
            text-align: center;
            padding: 48px;
            color: #94a3b8;
        }

        .modal-empty i {
            font-size: 52px;
            margin-bottom: 18px;
            opacity: 0.4;
        }

        .news-tab-btn {
            padding: 10px 20px;
            border: 2px solid #dbeafe;
            background: white;
            border-radius: 30px;
            cursor: pointer;
            font-size: 13px;
            color: #64748b;
            transition: all 0.2s;
            font-weight: 600;
        }

        .news-tab-btn:hover {
            border-color: #60a5fa;
            color: #1677FF;
            background: #f0f7ff;
        }

        .news-tab-btn.active {
            background: linear-gradient(135deg, #1677FF 0%, #4096ff 100%);
            border-color: transparent;
            color: #fff;
        }

        @media screen and (max-width: 1400px) {
            .stats-row {
                grid-template-columns: repeat(4, 1fr);
            }

            .main-content {
                grid-template-columns: 1fr;
            }
        }

        @media screen and (max-width: 768px) {
            body {
                padding: 16px;
            }

            .stats-row {
                grid-template-columns: repeat(2, 1fr);
                gap: 14px;
            }

            .medication-charts {
                grid-template-columns: 1fr;
            }

            .navbar {
                flex-direction: column;
                gap: 16px;
                padding: 16px;
            }

            .navbar-left {
                width: 100%;
                justify-content: space-between;
            }

            .time-panel {
                width: 100%;
                text-align: center;
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #cbd5e1 0%, #94a3b8 100%);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #94a3b8 0%, #64748b 100%);
        }

        .ws-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: #a8ceff;
            margin-left: 12px;
            padding: 4px 12px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .ws-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            animation: wsPulse 1.5s infinite;
        }

        .ws-dot.connected { 
            background: #22c55e; 
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.5);
        }
        
        .ws-dot.disconnected { 
            background: #ef4444; 
            animation: none; 
        }
        
        .ws-dot.connecting { 
            background: #f59e0b; 
            box-shadow: 0 0 8px rgba(245, 158, 11, 0.5);
        }

        @keyframes wsPulse { 
            0%, 100% { opacity: 1; } 
            50% { opacity: 0.5; } 
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="navbar">
            <div class="navbar-left">
                <a href="admin_index.html" class="back-link">
                    <i class="fas fa-arrow-left"></i>
                    返回工作台
                </a>
                <h1 class="navbar-title">
                    <i class="fas fa-chart-line"></i>
                    社区管理看板
                    <span id="wsStatus" class="ws-status">
                        <span class="ws-dot disconnected"></span>
                        <span class="ws-text">已断开</span>
                    </span>
                </h1>
            </div>
            <div class="time-panel">
                <div class="date" id="currentDate"></div>
                <div class="clock" id="currentTime"></div>
            </div>
        </header>

        <div class="stats-row">
            <div class="stat-card highlight" onclick="showModal('elders')">

    <script>
        let trendChart, pieChart;

        function updateDateTime() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
            const weekday = weekdays[now.getDay()];
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            document.getElementById('currentDate').textContent = year + '年' + month + '月' + day + '日 ' + weekday;
            document.getElementById('currentTime').textContent = hours + ':' + minutes + ':' + seconds;
        }

        function initCharts() {
            trendChart = echarts.init(document.getElementById('trendChart'));
            pieChart = echarts.init(document.getElementById('pieChart'));

            const trendOption = {

                        color: '#1e3a5f'

                            color: '#e0ebf7'

                    }

                        }

                    },
                    areaStyle: {

                                { offset: 0, color: 'rgba(22, 119, 255, 0.35)' },
                                { offset: 1, color: 'rgba(22, 119, 255, 0.05)' }
                            ]

                    },
                    itemStyle: {
                        color: '#1677FF'
                    },
                    data: []
                }]
            };

            const pieOption = {
                title: {
                    text: '今日服药情况',
                    left: 'center',

                        fontSize: 15,
                        fontWeight: 600,
                        color: '#0d4e7c'
                    }
                },
                tooltip: {
                    trigger: 'item',
                    formatter: '{b}: {c} ({d}%)',
                    backgroundColor: 'rgba(255, 255, 255, 0.95)',
                    borderColor: '#e0ebf7',
                    borderWidth: 1,
                    textStyle: {
                        color: '#1e3a5f'
                    }
                },
                legend: {
                    orient: 'horizontal',
                    bottom: '10px',
                    itemWidth: 14,
                    itemHeight: 14,
                    textStyle: {
                        color: '#64748b'
                    }
                },
                series: [{
                    name: '服药情况',
                    type: 'pie',
                    radius: ['42%', '68%'],
                    center: ['50%', '45%'],
                    avoidLabelOverlap: false,
                    itemStyle: {
                        borderRadius: 10,
                        borderColor: '#fff',
                        borderWidth: 3
                    },
                    label: {
                        show: true,
                        position: 'outside',
                        formatter: '{b}\n{c}次',
                        color: '#475569'
                    },
                    labelLine: {
                        show: true,
                        lineStyle: {
                            color: '#cbd5e1'
                        }
                    },
                    data: [
                        { value: 0, name: '按时服药', itemStyle: { color: '#52C41A' } },
                        { value: 0, name: '提前/补服', itemStyle: { color: '#1677FF' } },
                        { value: 0, name: '漏服', itemStyle: { color: '#F5222D' } }

            trendChart.setOption(trendOption);

        async function loadOverview() {
            try {
                const res = await fetch('/api/admin/dashboard/overview');
                const data = await res.json();
                if (data.code === 200) {
                    const d = data.data;
                    document.getElementById('elderTotal').textContent = d.elderTotal || 0;
                    document.getElementById('todayTaken').textContent = d.todayTaken || 0;
                    document.getElementById('todayShouldTake').textContent = d.todayShouldTake || 0;
                    document.getElementById('medicationRate').textContent = (d.medicationRate || 0) + '%';
                    document.getElementById('missedCount').textContent = d.missedCount || 0;
                    document.getElementById('lowStockCount').textContent = d.lowStockCount || 0;
                    document.getElementById('healthAbnormalCount').textContent = d.healthAbnormalCount || 0;
                    document.getElementById('emergencyCallCount').textContent = d.emergencyCallCount || 0;
                    document.getElementById('emergencyCallCount2').textContent = d.emergencyCallCount || 0;
                }
            } catch (e) {
                console.error('加载概览数据失败', e);
            }
        }

        async function loadMedicationTrend() {
            try {
                const res = await fetch('/api/admin/dashboard/medication/trend');
                const data = await res.json();
                if (data.code === 200) {
                    const dates = data.data.map(item => item.date);
                    const values = data.data.map(item => item.taken);
                    trendChart.setOption({
                        xAxis: { data: dates },
                        series: [{ data: values }]
                    });
                }
            } catch (e) {
                console.error('加载服药趋势失败', e);
            }
        }

        async function loadMedicationPie() {
            try {
                const res = await fetch('/api/admin/dashboard/medication/pie');
                const data = await res.json();
                if (data.code === 200) {
                    const d = data.data;
                    pieChart.setOption({
                        series: [{
                            data: [
                                { value: d.onTime || 0, name: '按时服药', itemStyle: { color: '#52C41A' } },
                                { value: d.early || 0, name: '提前/补服', itemStyle: { color: '#1677FF' } },
                                { value: d.missed || 0, name: '漏服', itemStyle: { color: '#F5222D' } }
                            ]
                        }]
                    });
                }
            } catch (e) {
                console.error('加载服药饼图失败', e);
            }
        }

        async function loadLowStock() {
            try {
                const res = await fetch('/api/admin/dashboard/medication/low-stock');
                const data = await res.json();
                if (data.code === 200 && data.data.length > 0) {
                    const html = data.data.map(item => {
                        let medicineName = item.medicineName || '';
                        if (!medicineName || medicineName.length < 2 || /^\d+$/.test(medicineName)) {
                            medicineName = '药品';
                        }
                        const daysRemaining = item.daysRemaining;
                        let daysText = '';
                        if (daysRemaining !== null && daysRemaining !== undefined) {
                            daysText = daysRemaining <= 0 ? '已不足' : `可服用${daysRemaining}天`;
                        } else {
                            daysText = '库存不足';
                        }
                        return `
                            <div class="low-stock-item">
                                <div class="low-stock-info">
                                    <div class="low-stock-avatar"><i class="fas fa-user"></i></div>
                                    <div>
                                        <div class="low-stock-name">${item.elderName || '未知'}</div>
                                        <div class="low-stock-medicine">${medicineName}</div>
                                    </div>
                                </div>
                                <div class="low-stock-count">
                                    <div class="low-stock-count-value">${daysText}</div>
                                </div>
                            </div>
                        `;
                    }).join('');
                    document.getElementById('lowStockList').innerHTML = html;
                }
            } catch (e) {
                console.error('加载用药不足预警失败', e);
            }
        }

        async function loadHealthAbnormal() {
            try {
                const res = await fetch('/api/admin/dashboard/health/abnormal');
                const data = await res.json();
                if (data.code === 200) {
                    const d = data.data;
                    document.getElementById('bpAbnormal').textContent = d.bpAbnormal || 0;
                    document.getElementById('hrAbnormal').textContent = d.hrAbnormal || 0;
                    document.getElementById('boAbnormal').textContent = d.boAbnormal || 0;
                    document.getElementById('bgAbnormal').textContent = d.bgAbnormal || 0;

                    const bpItem = document.getElementById('bpAbnormal').parentElement;
                    const hrItem = document.getElementById('hrAbnormal').parentElement;
                    const boItem = document.getElementById('boAbnormal').parentElement;
                    const bgItem = document.getElementById('bgAbnormal').parentElement;

                    if (d.bpAbnormal > 0) {
                        document.getElementById('bpAbnormal').classList.add('warning');
                        bpItem.classList.add('abnormal');
                    }
                    if (d.hrAbnormal > 0) {
                        document.getElementById('hrAbnormal').classList.add('warning');
                        hrItem.classList.add('abnormal');
                    }
                    if (d.boAbnormal > 0) {
                        document.getElementById('boAbnormal').classList.add('warning');
                        boItem.classList.add('abnormal');
                    }
                    if (d.bgAbnormal > 0) {
                        document.getElementById('bgAbnormal').classList.add('warning');
                        bgItem.classList.add('abnormal');
                    }
                }
            } catch (e) {
                console.error('加载健康异常数据失败', e);
            }
        }

        async function loadRecentHealth() {
            try {
                const res = await fetch('/api/admin/dashboard/health/recent');
                const data = await res.json();
                if (data.code === 200 && data.data.length > 0) {
                    const typeNames = { 'BP': '血压', 'HR': '心率', 'BO': '血氧', 'BG': '血糖' };
                    const typeIcons = { 'BP': 'bp', 'HR': 'hr', 'BO': 'bo', 'BG': 'bg' };
                    const html = data.data.map(item => {
                        let valueStr = item.value1 || '';
                        if (item.value2) valueStr += '/' + item.value2;
                        const date = parseDateTime(item.recordTime);
                        const time = date ? date.toLocaleString('zh-CN', {
                            month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'
                        }) : '';
                        return `
                            <div class="health-record">
                                <div class="health-record-icon ${typeIcons[item.dataType] || 'bp'}">
                                    <i class="fas fa-heartbeat"></i>
                                </div>
                                <div class="health-record-info">
                                    <div class="health-record-name">${item.elderName || '未知'}</div>
                                    <div class="health-record-value">${typeNames[item.dataType] || '未知'}: ${valueStr}</div>
                                </div>
                                <div class="health-record-time">${time}</div>
                            </div>
                        `;
                    }).join('');
                    document.getElementById('recentHealthList').innerHTML = html;
                }
            } catch (e) {
                console.error('加载最近健康数据失败', e);
            }
        }

                    const callTypeNames = { 'manual': '手动呼叫', 'auto': '自动呼叫' };
                    const html = data.data.map(item => {
                        const date = parseDateTime(item.callTime);
                        const time = date ? date.toLocaleString('zh-CN', {
                            month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'
                        }) : '';
                        return `

                                <div class="emergency-item-info">

                                    <div class="emergency-item-time">${time}</div>
                                </div>
                                <div class="emergency-item-status ${item.status}">${statusNames[item.status] || item.status}</div>
                            </div>

                    document.getElementById('emergencyList').innerHTML = html;

                    document.getElementById('emergencyList').innerHTML = `

                if (data.code === 200 && data.data.length > 0) {
                    const html = data.data.map(item => {
                        let time = '';
                        if (item.publishTime) {
                            const date = parseDateTime(item.publishTime);
                            if (date) {

                                    month: '2-digit', day: '2-digit'

                            }
                        }

        function parseDateTime(dateStr) {
            if (!dateStr) return null;
            if (typeof dateStr === 'string') {
                dateStr = dateStr.replace(' ', 'T');
                if (!dateStr.endsWith('Z') && !dateStr.includes('+')) {
                    dateStr = dateStr + '+08:00';
                }
            }
            const date = new Date(dateStr);
            return isNaN(date.getTime()) ? null : date;
        }

        function formatDateTime(dateStr) {
            const date = parseDateTime(dateStr);
            if (!date) return '-';
            return date.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function formatDate(dateStr) {
            const date = parseDateTime(dateStr);
            if (!date) return '-';
            return date.toLocaleDateString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            });
        }

                        <div style="display: flex; gap: 32px; flex-wrap: wrap;">
                            <div style="text-align: center;">
                                <div style="font-size: 32px; font-weight: 700; color: #dc2626;">${totalCount}</div>
                                <div style="font-size: 13px; color: #7f1d1d;">呼叫次数</div>
                            </div>
                            <div style="text-align: center;">
                                <div style="font-size: 32px; font-weight: 700; color: #059669;">${answeredCount}</div>
                                <div style="font-size: 13px; color: #166534;">已接听</div>
                            </div>
                            <div style="text-align: center;">
                                <div style="font-size: 32px; font-weight: 700; color: #d97706;">${cancelledCount}</div>
                                <div style="font-size: 13px; color: #78350f;">已取消</div>
                            </div>
                            <div style="text-align: center;">
                                <div style="font-size: 32px; font-weight: 700; color: #b45309;">${Math.max(0, noAnswerCount)}</div>
                                <div style="font-size: 13px; color: #78350f;">无人接听</div>
                            </div>
                        </div>
                    </div>
                `;

                if (data.code === 200 && data.data.length > 0) {
                    const html = `
                        ${statsHtml}
                        <table class="modal-table">
                            <thead>
                                <tr>
                                    <th>姓名</th>
                                    <th>呼叫类型</th>
                                    <th>呼叫时间</th>
                                    <th>状态</th>
                                    <th>接听人</th>
                                    <th>通话时长</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${data.data.map(item => {
                                    const statusClass = item.status === 'answered' ? 'success' : 
                                                       item.status === 'cancelled' ? 'info' : 
                                                       item.status === 'calling' ? 'warning' : 'danger';
                                    return `
                                        <tr>
                                            <td>${item.elderName || '-'}</td>
                                            <td>${callTypeNames[item.callType] || '-'}</td>
                                            <td>${item.callTime ? formatDateTime(item.callTime) : '-'}</td>
                                            <td><span class="status-tag ${statusClass}">${statusNames[item.status] || item.status}</span></td>
                                            <td>${item.answeredBy || '-'}</td>
                                            <td>${item.duration ? item.duration + '秒' : '-'}</td>
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    `;
                    bodyEl.innerHTML = html;
                } else {
                    bodyEl.innerHTML = `
                        ${statsHtml}
                        <div class="modal-empty"><i class="fas fa-check-circle" style="color: #52C41A;"></i><div>今日暂无呼叫记录详情</div></div>
                    `;
                }
            } catch (e) {
                document.getElementById('modalBody').innerHTML = '<div class="modal-empty"><i class="fas fa-exclamation-circle"></i><div>加载失败</div></div>';
            }
        }

        async function loadThresholdRiskModal() {
            try {
                const res = await fetch('/api/community/health/alerts');
                const data = await res.json();
                const bodyEl = document.getElementById('modalBody');

                if (data.code === 200 && data.data && data.data.length > 0) {
                    const html = `
                        <div style="margin-bottom: 20px; padding: 16px; background: #fff7ed; border-radius: 12px; border: 1px solid #fed7aa;">
                            <div style="display: flex; align-items: center; gap: 8px; color: #c2410c; font-weight: 600;">
                                <i class="fas fa-exclamation-triangle"></i>
                                <span>以下长辈的健康阈值设置存在风险，建议联系家属确认</span>
                            </div>
                        </div>
                        <table class="modal-table">
                            <thead>
                                <tr>
                                    <th>姓名</th>
                                    <th>风险等级</th>
                                    <th>风险说明</th>
                                    <th>建议</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${data.data.map(item => {
                                    const levelClass = item.riskLevel === 'critical' ? 'danger' : 'warning';
                                    const levelText = item.riskLevel === 'critical' ? '高危' : '风险';
                                    return `
                                        <tr>
                                            <td><strong>${item.userName || '-'}</strong></td>
                                            <td><span class="status-tag ${levelClass}">${levelText}</span></td>
                                            <td style="font-size: 13px; color: #64748b;">${(item.warnings || []).join('<br>')}</td>
                                            <td style="font-size: 13px; color: #059669;">${(item.suggestions || []).join('<br>')}</td>
                                            <td>
                                                <button onclick="sendAdviceToElder(${item.userId}, '${item.userName}')" 
                                                        style="padding: 6px 12px; background: #1677FF; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 12px;">
                                                    <i class="fas fa-paper-plane"></i> 发送建议
                                                </button>
                                            </td>
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    `;
                    bodyEl.innerHTML = html;
                } else {
                    bodyEl.innerHTML = `
                        <div class="modal-empty">
                            <i class="fas fa-check-circle" style="color: #52C41A;"></i>
                            <div>暂无阈值风险预警</div>
                        </div>
                    `;
                }
            } catch (e) {
                document.getElementById('modalBody').innerHTML = '<div class="modal-empty"><i class="fas fa-exclamation-circle"></i><div>加载失败</div></div>';
            }
        }

        function sendAdviceToElder(userId, userName) {
            const advice = prompt(`请输入发送给 ${userName} 的健康阈值建议：\n例如：建议您将心率阈值调整为55-100bpm，更符合老年人安全标准`);
            if (advice && advice.trim()) {
                axios.post('/api/community/health/advice/send', {
                    userId: userId,
                    adviceType: 'threshold_suggestion',
                    adviceContent: advice.trim()
                }).then(res => {
                    if (res.data.code === 200) {
                        alert('建议已发送');
                    } else {
                        alert('发送失败：' + res.data.msg);
                    }
                }).catch(err => {
                    console.error(err);
                    alert('发送失败');
                });
            }
        }

        async function loadCommunityInfo() {
            try {
                const res = await fetch('/api/admin/community/info');
                const data = await res.json();
                if (data.code === 200 && data.data) {
                    const navbarTitle = document.querySelector('.navbar-title');
                    const wsStatus = document.getElementById('wsStatus');
                    navbarTitle.innerHTML = 
                        '<i class="fas fa-chart-line"></i> ' + data.data.communityName + ' - 数据监控中心';
                    if (wsStatus) {
                        navbarTitle.appendChild(wsStatus);
                    }
                }
            } catch (e) {
                console.error('加载社区信息失败', e);
            }
        }

        function handleResize() {
            if (trendChart) trendChart.resize();
            if (pieChart) pieChart.resize();
        }

        function setupWebSocketStatusMonitor() {
            const wsStatusEl = document.getElementById('wsStatus');
            const wsDot = wsStatusEl ? wsStatusEl.querySelector('.ws-dot') : null;
            const wsText = wsStatusEl ? wsStatusEl.querySelector('.ws-text') : null;

            const updateStatus = () => {
                if (!window.AdminMessageCenter) {
                    console.log('[Dashboard] AdminMessageCenter 还未加载');
                    return;
                }

                const status = window.AdminMessageCenter.getConnectionStatus();
                if (wsDot && wsText) {
                    wsDot.className = 'ws-dot ' + status;
                    const statusMap = {
                        'connected': '已连接',
                        'disconnected': '已断开',
                        'connecting': '连接中'
                    };
                    wsText.textContent = statusMap[status] || '未知';
                    console.log('[Dashboard] WebSocket 状态:', status);
                }
            };

            // 立即执行一次
            updateStatus();
            
            // 等待 AdminMessageCenter 初始化
            let initAttempts = 0;
            const initCheck = setInterval(() => {
                initAttempts++;
                if (window.AdminMessageCenter && window.AdminMessageCenter.isConnected !== undefined) {
                    updateStatus();
                    console.log('[Dashboard] AdminMessageCenter 已就绪');
                    
                    if (window.AdminMessageCenter.onOnlineStatus) {
                        window.AdminMessageCenter.onOnlineStatus((userId, online) => {
                            console.log('[Dashboard] 用户在线状态变化:', userId, online);
                            updateStatus();
                        });
                    }
                    
                    clearInterval(initCheck);
                } else if (initAttempts > 20) {
                    console.warn('[Dashboard] AdminMessageCenter 初始化超时');
                    clearInterval(initCheck);
                }
            }, 500);

            // 持续监控状态
            setInterval(updateStatus, 2000);

            console.log('[Dashboard] WebSocket 状态监控已启动');
        }

        async function init() {
            updateDateTime();
            setInterval(updateDateTime, 1000);

            initCharts();

            await Promise.all([
                loadCommunityInfo(),
                loadOverview(),
                loadMedicationTrend(),
                loadMedicationPie(),
                loadLowStock(),
                loadHealthAbnormal(),
                loadRecentHealth(),
                loadEmergencyCalls(),
                loadEmergencyStats(),
                loadNewsStats(),
                loadNewsList(),
                loadThresholdRiskAlerts(),
                loadConfigLogs()
            ]);

            // 等待 AdminMessageCenter 初始化
            setTimeout(() => {
                setupWebSocketStatusMonitor();
            }, 1000);

            window.addEventListener('resize', handleResize);

            setInterval(() => {
                loadOverview();
                loadMedicationTrend();
                loadMedicationPie();
                loadLowStock();
                loadHealthAbnormal();
                loadRecentHealth();
                loadEmergencyCalls();
                loadEmergencyStats();
                loadNewsStats();
                loadNewsList();
                loadThresholdRiskAlerts();
                loadConfigLogs();
            }, 5000);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
