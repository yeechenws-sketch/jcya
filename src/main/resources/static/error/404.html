<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, nofollow">
    <title>页面未找到 - AI 智慧养老</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.45);
            --glass-border: rgba(255, 255, 255, 0.7);
            --primary: #4361EE;
            --danger: #F72585;
            --text: #1E293B;
            --text-light: #64748B;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: radial-gradient(circle at 10% 20%, #E0EAFC 0%, #CFDEF3 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .error-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 600px;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .error-code {
            font-size: clamp(80px, 20vw, 180px);
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--danger));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            position: relative;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .error-icon {
            font-size: clamp(60px, 15vw, 120px);
            color: var(--text-light);
            margin-bottom: 20px;
            animation: shake 2s ease-in-out infinite;
        }

        @keyframes shake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-5deg); }
            75% { transform: rotate(5deg); }
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(25px) saturate(160%);
            border-radius: 35px;
            border: 1.5px solid var(--glass-border);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05), inset 0 0 25px rgba(255, 255, 255, 0.3);
            padding: 40px;
            width: 100%;
            text-align: center;
            margin-top: 30px;
        }

        .error-title {
            font-size: clamp(24px, 5vw, 36px);
            font-weight: 700;
            color: var(--text);
            margin-bottom: 15px;
        }

        .error-desc {
            font-size: clamp(16px, 3vw, 20px);
            color: var(--text-light);
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: clamp(14px, 3vw, 18px);
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            touch-action: manipulation;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #5a7bff);
            color: white;
            box-shadow: 0 8px 25px rgba(67, 97, 238, 0.3);
        }

        .btn-primary:hover, .btn-primary:active {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(67, 97, 238, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.6);
            color: var(--text);
            border: 2px solid var(--glass-border);
        }

        .btn-secondary:hover, .btn-secondary:active {
            background: rgba(255, 255, 255, 0.8);
            transform: translateY(-3px);
        }

        .btn i {
            font-size: 1.2em;
        }

        .search-box {
            display: flex;
            width: 100%;
            max-width: 400px;
            margin: 0 auto 20px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50px;
            overflow: hidden;
            border: 1.5px solid var(--glass-border);
        }

        .search-box input {
            flex: 1;
            padding: 15px 25px;
            border: none;
            background: transparent;
            font-size: 16px;
            outline: none;
            font-family: inherit;
        }

        .search-box input::placeholder {
            color: var(--text-light);
        }

        .search-box button {
            padding: 15px 25px;
            background: var(--primary);
            border: none;
            color: white;
            cursor: pointer;
            font-size: 18px;
            transition: background 0.3s;
        }

        .search-box button:hover {
            background: #3451c9;
        }

        .quick-links {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.5);
        }

        .quick-link {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 20px;
            color: var(--text);
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s;
        }

        .quick-link:hover {
            background: rgba(255, 255, 255, 0.7);
            transform: scale(1.05);
        }

        .footer {
            margin-top: 40px;
            text-align: center;
            color: var(--text-light);
            font-size: 14px;
        }

        .footer a {
            color: var(--primary);
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .decorative-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: -1;
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            opacity: 0.1;
            animation: moveShape 20s infinite linear;
        }

        .shape-1 {
            width: 300px;
            height: 300px;
            background: var(--primary);
            top: -100px;
            right: -100px;
            animation-delay: 0s;
        }

        .shape-2 {
            width: 200px;
            height: 200px;
            background: var(--danger);
            bottom: -50px;
            left: -50px;
            animation-delay: -5s;
        }

        .shape-3 {
            width: 150px;
            height: 150px;
            background: var(--primary);
            top: 50%;
            left: 10%;
            animation-delay: -10s;
        }

        @keyframes moveShape {
            0% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(30px, 30px) rotate(180deg); }
            100% { transform: translate(0, 0) rotate(360deg); }
        }

        @media (max-width: 600px) {
            .glass-card {
                padding: 25px;
                border-radius: 25px;
            }

            .action-buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }

            .quick-links {
                flex-direction: column;
                align-items: center;
            }
        }

        @media (orientation: landscape) and (max-height: 500px) {
            body {
                padding: 15px;
            }

            .error-code {
                font-size: 80px;
            }

            .error-icon {
                font-size: 50px;
                margin-bottom: 10px;
            }

            .glass-card {
                padding: 20px;
                margin-top: 15px;
            }

            .error-title {
                font-size: 20px;
                margin-bottom: 10px;
            }

            .error-desc {
                font-size: 14px;
                margin-bottom: 15px;
            }

            .action-buttons {
                flex-direction: row;
                margin-bottom: 15px;
            }

            .btn {
                padding: 10px 20px;
                font-size: 14px;
            }

            .footer {
                margin-top: 20px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .error-code,
            .error-icon,
            .shape {
                animation: none;
            }

            .error-container {
                animation: none;
            }
        }
    </style>
</head>
<body>
    <div class="decorative-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="error-container">
        <i class="fa fa-compass error-icon" aria-hidden="true"></i>
        <div class="error-code">404</div>

        <div class="glass-card">
            <h1 class="error-title">哎呀，页面走丢了</h1>
            <p class="error-desc">
                您访问的页面可能已被移除、名称已更改或暂时不可用。<br>
                别担心，让我们帮您找到正确的方向。
            </p>

            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜索您想找的内容..." aria-label="搜索">
                <button type="button" onclick="handleSearch()" aria-label="搜索按钮">
                    <i class="fa fa-search"></i>
                </button>
            </div>

            <div class="action-buttons">
                <a href="/index.html" class="btn btn-primary">
                    <i class="fa fa-home"></i>
                    返回首页
                </a>
                <button onclick="goBack()" class="btn btn-secondary">
                    <i class="fa fa-arrow-left"></i>
                    返回上页
                </button>
            </div>

            <div class="quick-links">
                <a href="/health.html" class="quick-link"><i class="fa fa-heartbeat"></i> 健康监测</a>
                <a href="/medicine.html" class="quick-link"><i class="fa fa-medkit"></i> 用药管家</a>
                <a href="/news.html" class="quick-link"><i class="fa fa-newspaper-o"></i> 新闻播报</a>
                <a href="/msg.html" class="quick-link"><i class="fa fa-comments-o"></i> 子女留言</a>
            </div>
        </div>

        <footer class="footer">
            <p>&copy; 2026 AI 智慧养老平台 · <a href="/login.html">网站首页</a> · <a href="javascript:contactSupport()">联系客服</a></p>
        </footer>
    </div>

    <script>
        function goBack() {
            if (document.referrer && document.referrer !== '') {
                window.history.back();
            } else {
                window.location.href = '/index.html';
            }
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (query) {
                window.location.href = '/index.html?search=' + encodeURIComponent(query);
            }
        }

        function contactSupport() {
            alert('客服热线：177-236-5411\n服务时间：周一至周日 8:00-20:00');
        }

        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                handleSearch();
            }
        });
    </script>
</body>
</html>
