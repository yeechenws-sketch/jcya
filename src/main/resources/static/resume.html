<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于作者 - 解尘颐安</title>
    <link rel="stylesheet" href="lib/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #4361EE;
            --primary-dark: #3a56d4;
            --primary-light: #6366f1;
            --deep-blue: #1e3a8a;
            --text-dark: #1e293b;
            --text-light: #64748b;
            --glass-bg: rgba(255, 255, 255, 0.55);
            --glass-border: rgba(255, 255, 255, 0.7);
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #E0EAFC 0%, #CFDEF3 50%, #E0EAFC 100%);
            min-height: 100vh;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(circle at 2px 2px, rgba(67, 97, 238, 0.08) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        .wrap {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 640px;
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 48px 40px;
            box-shadow: 0 20px 60px rgba(30, 58, 138, 0.12);
            text-align: center;
        }

        .avatar {
            width: 96px;
            height: 96px;
            margin: 0 auto 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: #fff;
            font-size: 38px;
            font-weight: 800;
            box-shadow: 0 10px 28px rgba(67, 97, 238, 0.35);
        }

        .tag {
            display: inline-block;
            font-size: 13px;
            letter-spacing: 2px;
            color: var(--primary);
            background: rgba(67, 97, 238, 0.1);
            border-radius: 999px;
            padding: 6px 16px;
            margin-bottom: 14px;
        }

        h1 {
            font-size: 32px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--deep-blue), var(--primary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 15px;
            color: var(--text-light);
            margin-bottom: 28px;
        }

        .info-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 28px;
            text-align: left;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 14px;
            padding: 14px 18px;
            font-size: 15px;
        }

        .info-item i {
            color: var(--primary);
            width: 20px;
            text-align: center;
        }

        .info-item .label {
            color: var(--text-light);
            min-width: 52px;
        }

        .info-item .value {
            font-weight: 600;
            word-break: break-all;
        }

        .info-item a {
            color: var(--primary);
            text-decoration: none;
        }

        .info-item a:hover {
            text-decoration: underline;
        }

        .note {
            font-size: 13px;
            line-height: 1.9;
            color: var(--text-light);
            background: rgba(255, 255, 255, 0.45);
            border-left: 3px solid var(--primary);
            border-radius: 8px;
            padding: 14px 16px;
            text-align: left;
            margin-bottom: 26px;
        }

        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 22px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: transform .2s ease, box-shadow .2s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: #fff;
            box-shadow: 0 8px 20px rgba(67, 97, 238, 0.3);
        }

        .btn-ghost {
            background: rgba(255, 255, 255, 0.7);
            color: var(--deep-blue);
            border: 1px solid rgba(67, 97, 238, 0.25);
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .footer {
            text-align: center;
            font-size: 12px;
            color: var(--text-light);
            margin-top: 22px;
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="card">
        <div class="avatar">望</div>
        <span class="tag">ABOUT THE AUTHOR</span>
        <h1>关于作者</h1>
        <p class="subtitle">解尘颐安 · 智慧养老陪伴系统</p>

        <div class="info-list">
            <div class="info-item">
                <i class="fa fa-user-circle"></i>
                <span class="label">昵称</span>
                <span class="value">望山遥</span>
            </div>
            <div class="info-item">
                <i class="fa fa-envelope"></i>
                <span class="label">邮箱</span>
                <span class="value"><a href="mailto:yeechen177@163.com">yeechen177@163.com</a></span>
            </div>
        </div>

        <div class="note">
            本项目为本科毕设级别的个人作品，前后端均由作者个人在 AI 辅助下完成，代码主要面向学习与交流。<br>
            欢迎就功能设计、适老化体验、嵌入式硬件等方面提 Issue 或邮件交流；如需二次开发，请自行评估稳定性与合规性。
        </div>

        <div class="actions">
            <a class="btn btn-primary" href="index.html"><i class="fa fa-home"></i> 返回首页</a>
            <a class="btn btn-ghost" href="about.html"><i class="fa fa-info-circle"></i> 关于我们</a>
        </div>
    </div>

    <div class="footer">解尘颐安智慧养老 · 让科技为爱护航</div>
</div>
</body>
</html>
